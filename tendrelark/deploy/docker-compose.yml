# One server, two containers: the site, and Caddy in front of it for automatic HTTPS.
# Run from this folder:  docker compose up -d --build
# See docs/deploy.md for the full walk through.
#
# WARNING: never run `docker compose down -v`. The -v deletes the volumes, and the database lives in one.

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: production.env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/tendrelark.db
      BACKUP_DIR: /data/backups
      TRUST_PROXY: "1"
      ENABLE_SCHEDULER: "true"
    volumes:
      - tendrelark-data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  tendrelark-data:
  caddy-data:
  caddy-config:
