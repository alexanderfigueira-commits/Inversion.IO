let lang='pt', cat='t_hands', breathState='idle';
try{ lang = localStorage.getItem('f2z-lang') || ''; }catch(e){ lang=''; }
if(lang!=='pt' && lang!=='en') lang = (navigator.language||'pt').toLowerCase().startsWith('pt') ? 'pt' : 'en';

const tabs=document.getElementById('tabs'), list=document.getElementById('list');
const orb=document.getElementById('orb'), bb=document.getElementById('breathBtn');
const fmt=n=> n.toFixed(2).replace('.', lang==='pt'?',':'.')+' €';

function renderList(){
  const i = lang==='pt'?0:1;
  tabs.innerHTML='';
  Object.keys(DATA).forEach(k=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=T[lang][k];
    b.setAttribute('aria-pressed', k===cat); b.onclick=()=>{cat=k;renderList();}; tabs.append(b);
  });
  list.innerHTML='';
  DATA[cat].forEach(row=>{
    const d=document.createElement('div'); d.className='item';
    const s=document.createElement('span'); s.textContent=row[i];
    const p=document.createElement('span'); p.className='price'+(row[2]==null?' ask':'');
    p.textContent = row[2]==null ? T[lang].ask : fmt(row[2]);
    d.append(s,p); list.append(d);
  });
}
function renderBreathLabels(){
  if(breathState==='idle'){ orb.textContent=T[lang].b_ready; bb.textContent=T[lang].b_start; }
  else { bb.textContent=T[lang].b_stop; orb.textContent=T[lang]['b_'+breathState]; }
}
function setLang(l){
  lang=l; try{ localStorage.setItem('f2z-lang',l); }catch(e){}
  document.documentElement.lang = l==='pt'?'pt-PT':'en';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=T[l][el.dataset.i18n]; });
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===l));
  renderList(); renderBreathLabels();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

let timers=[], running=false;
function phase(cls,ms,next){ breathState=cls; orb.className='orb '+cls; renderBreathLabels(); timers.push(setTimeout(next,ms)); }
function cycle(){
  if(!running)return;
  orb.style.transitionDuration='4s';
  phase('in',4000,()=>{ if(!running)return;
    phase('hold',2000,()=>{ if(!running)return;
      orb.style.transitionDuration='6s';
      phase('out',6000,cycle);});});
}
function stop(){running=false;timers.forEach(clearTimeout);timers=[];breathState='idle';orb.className='orb';orb.style.transitionDuration='';renderBreathLabels();}
bb.onclick=()=>{ if(running){stop();return;} running=true;cycle(); };

document.getElementById('y').textContent=new Date().getFullYear();
setLang(lang);
</script>
